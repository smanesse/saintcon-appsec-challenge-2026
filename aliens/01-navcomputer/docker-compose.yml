services:
  alien-ship:
    build:
      context: .
      args:
        FLAG: "${FLAG:-SAINTCON{local_navcomputer_flag}}"
    image: alien-ship
    container_name: alien-ship
    ports:
      - "8091:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
