# Origin app — loopback only; the Varnish edge is the sole exposed service.
server.port=9090
server.address=127.0.0.1

# Modest worker pool, with headroom for concurrent launch confirmations.
server.tomcat.threads.max=40
server.tomcat.threads.min-spare=5

server.servlet.session.timeout=30m

# Static console assets are genuinely cacheable (real static files).
spring.web.resources.cache.cachecontrol.max-age=60
spring.web.resources.cache.cachecontrol.cache-public=true

# read-only rootfs: all scratch goes to tmpfs
server.tomcat.basedir=/tmp/tomcat

logging.level.root=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{0} - %msg%n
