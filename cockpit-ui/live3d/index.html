<!doctype html>
<!-- SAINTCON 2026 — THE COCKPIT.

     THIS IS THE ENTRY POINT.  Serve the REPO ROOT and open this page:

         cd /path/to/saintcon/2026
         python3 -m http.server 8777
         open http://localhost:8777/live3d/

     or just run  ./live3d/run.sh  , which does both.

     `file://` DOES NOT WORK and is not a bug in this page: an ES module
     import, and the fetches of scene.json / depth.bin / *.glb, are all blocked
     by the browser's own origin rules for file URLs.  The page says so in
     plain words if you try.

     WHAT IT IS
     ----------
     Three tiers, exactly as ratified in README section 12:

       1. THE WIDE SHOT is the shipped baked plate, referenced IN PLACE from
          ../cockpit/combined/main_plate.png.  It is never re-rendered and
          never copied, so it is provably the same pixels.  Hover glow and
          hotspot for all NINE modules come from the shipped
          combined/manifest.json, also read in place.

       2. THE CLOSE-UP is a LIVE three.js page per module, one of the nine
          under live3d/modules/, opened in an iframe with `?embed=1` and flown
          into by transition.js.  Every module keeps its own measured
          constants -- its own light_gain, its own ubias_m, its own grade, its
          own readout planes -- because those are measurements of that module
          and not fleet settings.  See live3d/RESULTS.md.

       3. CONTENT TEXT IS DOM, inside each module page, laid on the
          instrument's own surface by css3d.js and sandwiched between two
          WebGL canvases so geometry can pass in front of it.

     WHY AN IFRAME AND NOT NINE `import()`s
     --------------------------------------
     Each module page owns two WebGL contexts, a requestAnimationFrame loop, a
     resize listener and the global `window.__occ`.  Nine of those in one
     document is 18 contexts against a browser limit around 16, and there is no
     teardown path -- the modules are written as top-level scripts, not as
     disposable classes.  An iframe is created on hover, flown into on click
     and DESTROYED on the way out, which frees both contexts with certainty.
     It also means the page the cockpit shows is byte-for-byte the page the
     checkers verified: `modules/<CODE>/index.html`, unmodified.

     TRAP 20, AND IT IS WHY THE IFRAME IS TRANSPARENT
     ------------------------------------------------
     The close-up plates are FILM-TRANSPARENT and must composite over the
     dimmed wide shot -- cockpit/make_cockpit.py does it with
     `blur(2px) brightness(.35)`.  OTA's plate is only 35% opaque.  So the wide
     layer STAYS on screen underneath, dimmed and defocused (transition.js
     lands it on dimEnd and leaves it), and the module page declares
     `html.embed body{background:transparent}` so what shows through its plate
     is that backdrop and not black. -->
<meta charset="utf-8">
<title>USS AUDITOR-7 — cockpit</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#02030a;overflow:hidden;color:#9fb6d0;
    font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  /* The cockpit plate's window is an ALPHA HOLE (rendered film_transparent),
     so whatever sits behind it shows through. That is the whole point of the
     starfield: it is the view out of the ship. Must stay BELOW #viewport. */
  #stars{position:fixed;left:0;right:0;top:0;bottom:0;
    width:100%;height:100%;z-index:0;display:block}
  #viewport{position:fixed;left:0;right:0;top:0;bottom:0;overflow:hidden;
    z-index:1}
  /* Bands outside the fitted plate. Same color as the page. They live in
     #viewport, under the plate, so the window hole still shows #stars and
     these never paint over the person button or its menu. */
  #starVeil{position:absolute;inset:0;z-index:0;pointer-events:none}
  #starVeil span{position:absolute;display:block;background:#02030a}
  #starVeilTop,#starVeilBottom{left:0;right:0}
  #starVeilTop{top:0}
  #starVeilBottom{bottom:0}
  #starVeilLeft{left:0}
  #starVeilRight{right:0}
  .stage{position:absolute;left:0;top:0;width:1280px;height:720px;
    transform-origin:0 0}
  .stage>*{position:absolute;left:0;top:0}
  .layer{width:1280px;height:720px;pointer-events:none;user-select:none;
    -webkit-user-drag:none}

  /* ---------------------------------------------------------------- layers
     wide (1) -- vignette (2) -- close (3).
     #wide and #close are driven ONLY by transition.js; neither carries a CSS
     transition, because the two have to stay locked to each other frame by
     frame and a CSS timing function on each would let them drift apart. */
  #wide{z-index:1;will-change:transform,filter}
  #wPlate{z-index:1}
  #wGlows{z-index:2}
  /* THE TELLTALE MAST LAYER — live3d/design/STATUS_AT_A_GLANCE.md section 3.1.
     Nine <svg> masts drawn from live3d/status.json through live3d/status.js,
     authored in the SAME canonical 1280x720 px as everything else inside
     #stage, so one translate+scale on #stage scales them with the plate and
     they ride the dolly during the dive.  pointer-events:none via .layer, so
     hover and click are byte-for-byte what they were before this existed --
     the mast's own hotspot is a .whot in #wHots like the other nine.
     #wHots MOVED FROM 3 TO 4 for this: index.html gave it z 3 with no room
     above it inside #wide (section 12.9). */
  #wTells{z-index:3}
  /* THE STANDINGS PLATE'S LAYER — live3d/design/LEADERBOARD.md section 2.2.
     That section calls a brass entry affordance on the plate "a legitimate v2
     and not built".  It is built now, and this is where it lands: two sprites,
     the prop then its hover mask, authored in the SAME canonical 1280x720 px
     as the plate and rendered from the SAME Blender camera in the SAME scene
     (live3d/pipeline/standings_plate.py), so they are pixels of the cockpit
     rather than a box drawn over it.  Both are children of #wide, so one
     translate+scale on #stage scales them with the plate and they ride the
     dolly during a dive — the nameplate is bolted to the ship and goes where
     the ship goes.  pointer-events:none via .layer; the fitting's own pointer
     target is a .whot in #wHots, exactly like the nine modules' and the nine
     masts'.
     #wHots MOVED FROM 4 TO 5 for this, which is the same one-line move the
     comment above records the telltale mast making from 3 to 4.  It is the
     only line in this file that is changed rather than added.
     WHY NOT #wGlows.  check/drive_cockpit.mjs reads a module's glow tint as
     `[...document.querySelectorAll('#wGlows img')][codes().indexOf(code)]` —
     a POSITIONAL index into that layer.  A tenth image in #wGlows would shift
     it and every one of the nine would report the wrong tint. */
  #wGrade{z-index:3}
  #wFit{z-index:4}
  #wHots{z-index:5}
  #wTells .tell{position:absolute;overflow:visible}
  /* "Lit by the same light": on hover, the mast's #CDB77E highlight edge
     brightens for the 160 ms of the glow transition.  Section 2.4 -- the
     telltale is opaque hard-edged hardware OUTSIDE the module silhouette, so it
     must not fight the soft screen-blended bloom, only acknowledge it. */
  #wTells .tell .hl{transition:fill .16s}
  #wTells .tell.hot .hl{fill:#F0E2B4}
  /* THE ONLY ANIMATION IN THE INDICATOR.  A 9 px band with a 3 px bright core
     sweeps the bore from the collar end outward while a run is in flight,
     1.4 s per cycle.  It exists because the real thing takes minutes:
     unit_tests/run-in-docker.sh does a `docker compose --build`.  Nothing else
     in the layer moves, and a page with no running module rests dead still --
     which is what check_occlusion.py and check_text.py require of a pose. */
  #wTells .tell .sweep{animation:tellSweep 1.4s ease-in-out infinite}
  @keyframes tellSweep{from{transform:translate(0px,0px)}
                       to{transform:translate(0px,35px)}}
  .glow{position:absolute;left:0;top:0;width:1280px;height:720px;opacity:0;
    pointer-events:none;transition:opacity .16s;mix-blend-mode:screen;
    filter:sepia(1) saturate(5) hue-rotate(-12deg) brightness(1.2)
      drop-shadow(0 0 5px rgba(255,215,106,.95))
      drop-shadow(0 0 16px rgba(199,154,46,.7))}
  /* PKT is the offensive panel and declares glow_tint:"red" in the manifest --
     it must not glow brass like the eight maintenance modules. */
  .glow.tint-red{filter:sepia(1) saturate(7) hue-rotate(-52deg) brightness(1.25)
      drop-shadow(0 0 6px rgba(255,120,96,.95))
      drop-shadow(0 0 18px rgba(200,60,40,.75))}
  body.closeup #wGrade .glow,
  body.board #wGrade .glow,
  body.moving #wGrade .glow,
  body:has(#tutorialCard:not([hidden])) #wGrade .glow,
  body:has(#gradePanel:not([hidden])) #wGrade .glow{opacity:0 !important}
  .whot{position:absolute;cursor:pointer;border:1px solid transparent;
    border-radius:3px}
  /* an unreleased module's hotspot: still hoverable (tooltip reads NOT YET
     AVAILABLE) but the dive is refused, so it must not read as clickable */
  .whot.locked{cursor:default}
  body.debug .whot{border-color:rgba(63,224,255,.55);
    background:rgba(63,224,255,.06)}

  /* A soft lens vignette that closes over the periphery mid-dive and opens
     again on arrival.  Screen space on purpose: it is a lens effect, not scene
     content, so it must NOT ride the dolly. */
  #vig{z-index:2;opacity:0;
    background:radial-gradient(ellipse 72% 72% at 50% 50%,
      rgba(2,3,10,0) 0%,rgba(2,3,10,0) 46%,rgba(2,3,10,.42) 78%,
      rgba(2,3,10,.80) 100%)}

  #close{z-index:3;opacity:0;pointer-events:none;will-change:transform,opacity}
  body.closeup #close{pointer-events:auto}
  /* Feathered while the close plate is smaller than the frame, so its edge
     blends into the wide plate behind instead of reading as a pasted inset.
     ONLY while moving: a mask on the resting close-up would be a defect. */
  body.moving #close{
    -webkit-mask-image:
      linear-gradient(to right,transparent 0,#000 var(--fx,0%),
                      #000 calc(100% - var(--fx,0%)),transparent 100%),
      linear-gradient(to bottom,transparent 0,#000 var(--fy,0%),
                      #000 calc(100% - var(--fy,0%)),transparent 100%);
    -webkit-mask-composite:source-in;
    mask-image:
      linear-gradient(to right,transparent 0,#000 var(--fx,0%),
                      #000 calc(100% - var(--fx,0%)),transparent 100%),
      linear-gradient(to bottom,transparent 0,#000 var(--fy,0%),
                      #000 calc(100% - var(--fy,0%)),transparent 100%);
    mask-composite:intersect}

  /* THE DIVE'S OWN PICTURE.  The baked close-up plates, exactly the layers
     cockpit/cockpit.html shows and exactly what transition.json's M was
     measured against -- so the match dissolve is the measured one.  They are
     removed once the live page has faded in, because two film-transparent
     copies of the same plate composite to the wrong alpha. */
  #cLayers{z-index:1}
  #cLayers img{position:absolute;left:0;top:0;width:1280px;height:720px;
    pointer-events:none;user-select:none;-webkit-user-drag:none}

  /* THE LIVE MODULE.  #cWrap counter-scales the stage's own fit so the iframe
     is laid out at the size it will actually occupy ON SCREEN -- see
     sizeFrame() in app.js.  Without it the module page's layout() would solve
     its pixel ratio against a 1280x720 viewport while the cockpit displayed it
     at k x that, and the live geometry would render under-dense beside a
     baked plate that is not.  That is README 16.5's failure mode wearing a
     different hat. */
  #cWrap{z-index:2;transform-origin:0 0;width:1280px;height:720px}
  #cFrame{border:0;display:block;background:transparent;opacity:0;
    transition:opacity .26s linear}
  body.live #cFrame{opacity:1}

  /* ------------------------------------------------- THE MUSTER BOARD OVERLAY
     live3d/design/LEADERBOARD.md.  The standings are NOT a module: they have
     no entry in cockpit/combined/manifest.json, none in transition.json and no
     measured M, and the wide shot answers exactly one question -- which module
     do I go and work on -- which is not this one (STATUS_AT_A_GLANCE 350).

     So the cockpit gets ONE BUTTON AND ONE OVERLAY, and deliberately nothing
     else.  #lbHost is a NEW element at a NEW z-index, a sibling of #viewport:
     above #close (z 3, inside #stage) and below the person button.  It re-enters
     nothing -- not openModule(), not the dolly, not #cLayers, not landLive(),
     not transition.json.  Every one of those carries measured constants and
     every one of them is a chance to break the nine.

     Opaque, not film-transparent: the board is a whole separate instrument
     standing in front of the cockpit, not a close-up compositing over it, so
     trap 20 does not arise here and a scrim is the honest reading. */
  #lbHost{position:fixed;left:0;right:0;top:0;bottom:0;z-index:15;
    display:none;opacity:0;background:#02030a;
    transition:opacity .22s ease-out}
  body.board #lbHost{display:block;opacity:1}
  #lbFrame{border:0;display:block;width:100%;height:100%;background:#02030a}

  /* ---- chrome ----
     The bottom bar is gone. The person button is the only control on the
     bottom edge. Menu labels are not forced into uppercase. */
  button{font:inherit;letter-spacing:.12em;text-transform:uppercase;
    white-space:nowrap;flex:none;
    padding:5px 10px;background:#131a26;color:#9fb6d0;border:1px solid #24405e;
    border-radius:3px;cursor:pointer}
  button:hover{color:#d8e8fa;border-color:#3d6a96}
  button.on{background:#c79a2e;color:#161208;border-color:#f2d67a}
  button[disabled]{opacity:.35;cursor:default;border-color:#1d2836}
  /* The icon stays put. Opening the menu does not move it. The card
     wraps it, with the buttons above and the circle fully inside. */
  #personDock{position:fixed;right:16px;bottom:16px;z-index:45;
    width:48px;height:48px;
    transition:right .55s cubic-bezier(.22,.61,.36,1)}
  body:has(#tutorialCard:not([hidden])) #personDock,
  body:has(#helpCard:not([hidden])) #personDock{right:calc(100% - 64px)}
  #personFab{position:absolute;inset:0;z-index:2;
    width:48px;height:48px;padding:0;display:flex;align-items:center;justify-content:center;
    border-radius:50%;background:rgba(4,8,16,.92);border:1px solid #3d6a96;color:#d8e8fa;
    letter-spacing:0;text-transform:none;
    box-shadow:0 0 0 1px rgba(2,3,10,.6),0 2px 12px rgba(0,0,0,.55)}
  @media (prefers-reduced-motion:reduce){#personDock,#personMenu,#branchPanel{transition:none}}
  #personFab svg{width:28px;height:28px;display:block;pointer-events:none}
  #personFab:hover,#personFab:focus-visible{border-color:#f2d67a;color:#fff}
  #personFab[aria-expanded="true"]{border-color:#f2d67a;color:#f2d67a}
  #personFab.bn-glow{box-shadow:0 0 16px 3px rgba(242,214,122,.45)}
  #personFab:focus-visible{outline:3px solid #f2d67a;outline-offset:3px}
  #personMenu{position:absolute;z-index:1;right:-8px;bottom:-8px;
    width:min(280px,calc(100vw - 24px));display:flex;flex-direction:column;gap:6px;
    padding:10px 10px 64px;background:rgba(4,8,16,.96);border:1px solid #3d6a96;border-radius:4px;
    box-shadow:0 8px 28px rgba(0,0,0,.65);text-align:left;
    transform-origin:calc(100% - 32px) calc(100% - 32px);transform:scale(1);
    transition:transform .28s cubic-bezier(.22,.61,.36,1)}
  #personMenu[data-grow="no"]{transform:scale(0);pointer-events:none}
  #personMenu > *{opacity:0;transition:opacity .14s ease}
  #personMenu[data-shown="yes"] > *{opacity:1}
  body:has(#tutorialCard:not([hidden])) #personMenu,
  body:has(#helpCard:not([hidden])) #personMenu{
    right:auto;left:-8px;width:min(280px,calc(100vw - 320px));
    transform-origin:32px calc(100% - 32px)}
  #personMenu[hidden]{display:none !important}
  @media (prefers-reduced-motion:reduce){#personMenu > *{transition:none}}
  #personMenu .menu-submits{display:flex;flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:8px;
    margin:0 0 8px;padding:8px;border:1px solid #3d6a96;border-radius:4px;background:#101820}
  #personMenu .menu-submits-row{display:flex;flex-wrap:nowrap;align-items:center;justify-content:space-between;
    gap:6px;width:100%;min-width:0}
  #personMenu .menu-submits .sl-meter{display:inline-flex;align-items:center;gap:4px;min-width:0;
    color:#9fb6d0}
  #personMenu .menu-submits .sl-chunks{display:flex;align-items:flex-end;gap:2px;height:14px}
  #personMenu .menu-submits .sl-box{width:8px;height:14px;box-sizing:border-box;border:1px solid #3d6a96;
    border-radius:1px;background:transparent;display:inline-flex}
  #personMenu .menu-submits .sl-box:not(.is-left){background:#5f7590;border-color:#5f7590}
  #personMenu .menu-submits .sl-box:not(.is-left)::before{content:none}

  #personMenu .menu-submits .grade-limits-refresh.is-reading svg{animation:gradeLimitsSpin .7s linear 1}
  #personMenu .menu-submits .sl-meter-n{font-size:12px;font-weight:600;color:#f2d67a}
  #personMenu .menu-submits .grade-dash-tools{display:inline-flex;align-items:center;gap:6px;flex:none}
  #personMenu .menu-submits button{width:22px;height:22px;min-width:22px;padding:0;border:0;
    border-radius:50%;text-align:center;justify-content:center;flex:none}
  #personMenu .menu-submits .grade-dash-plus{background:#007302;color:#f4fff4;font-size:16px;line-height:1}
  #personMenu button{text-transform:none;letter-spacing:.03em;text-align:left;width:100%;
    height:32px;box-sizing:border-box;display:flex;align-items:center}
  /* The old 18px sat only above Re-open tutorial. Split it across both sides. */
  #bTutorial{margin-top:9px;margin-bottom:9px}
  /* Sign-out is opposite the icon, centered on its height. Not with Up to date. */
  #personMenu .menu-foot{position:absolute;left:10px;right:64px;bottom:8px;height:48px;
    display:flex;align-items:center;gap:8px}
  body:has(#tutorialCard:not([hidden])) #personMenu .menu-foot,
  body:has(#helpCard:not([hidden])) #personMenu .menu-foot{left:64px;right:10px}
  body:has(#tutorialCard:not([hidden])) #personMenu .menu-foot #bAuth,

  #personMenu #bAuth .auth-out{width:16px;height:16px;display:none}
  #personMenu #bAuth[data-mode="out"] .auth-label{display:none}
  #personMenu #bAuth[data-mode="out"] .auth-out{display:block !important}
  /* Name only while the menu is open. Beside the icon: left of it on the
     right, right of it after the slide. */
  #crew{flex:1;min-width:0;height:48px;margin:0;padding:0;
    display:flex;flex-direction:column;justify-content:center;
    overflow:hidden;text-align:right;border:0;background:transparent;
    font-size:12px;letter-spacing:.04em;color:#9fb6d0}
  body:has(#tutorialCard:not([hidden])) #crew,
  body:has(#helpCard:not([hidden])) #crew{text-align:left}
  #crewWho{display:block;color:#f2d67a;overflow:hidden;text-overflow:clip;white-space:nowrap;
    line-height:1.15}
  #crewWho .who-run{display:inline-block;white-space:nowrap;width:max-content}
  #crewWho.is-scroll{text-align:left}
  @media (prefers-reduced-motion:reduce){#crewWho.is-scroll .who-run{animation:none}}
  #crewSep{display:none}
  #crewRet,#crewN{display:block;font-size:10.5px;letter-spacing:.06em;white-space:nowrap;

  #crewUpd:empty{display:none;pointer-events:none}
  /* Shown in the menu only while a submission is non-terminal. */
  #gradeTell{display:flex;align-items:center;gap:6px;width:100%;
    border-color:#877647;color:#f2d67a;background:#1a1407;font-size:12px;text-transform:none}
  #gradeTell:hover{color:#fff;border-color:#f2d67a}
  #gradeTell .gt-dot{width:7px;height:7px;border-radius:50%;background:#f2d67a;
    box-shadow:0 0 6px #f2d67a;flex:none;animation:gtPulse 1.3s ease-in-out infinite}
  #gradeTell .gt-text{letter-spacing:.08em;max-width:30ch;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @keyframes gtPulse{0%,100%{opacity:1}50%{opacity:.3}}
  @media (prefers-reduced-motion:reduce){#gradeTell .gt-dot{animation:none}}
  #tip{position:fixed;z-index:30;pointer-events:none;opacity:0;
    transition:opacity .14s;background:rgba(4,8,16,.9);border:1px solid #c79a2e;
    color:#f2d67a;padding:5px 9px;border-radius:3px;letter-spacing:.16em;
    text-transform:uppercase;
    /* PRE, not NOWRAP: the tooltip is two lines now -- the module
       name, then one line of status (section 5.1).  Both are set
       with textContent and a \n; neither wraps. */
    white-space:pre;line-height:1.45}
  #err{position:fixed;inset:auto 76px 16px 12px;z-index:50;display:none;
    background:#2a0d0d;border:1px solid #a33;color:#ffb4b4;padding:10px 12px;

  /* Coordinator link strip (track 01).  Empty host; JS fills it with
     textContent.  Not a bottom bar. */
  #linkUx{position:fixed;left:0;right:0;top:8px;z-index:25;
    pointer-events:none;display:flex;justify-content:center;
    padding:6px 12px 0}
  /* One submissions-left card. Not a stack of repeating lines, and not a

<script>
/* file:// -- SAY SO, RATHER THAN SHOWING A BLANK PAGE.
   This has to be an ordinary inline script, not part of app.js, because app.js
   is an ES MODULE and a module load over file:// is refused before one line of
   it runs.  Measured, in Chrome 152:
       Access to script at 'file:///.../live3d/app.js' from origin 'null' has
       been blocked by CORS policy: Cross origin requests are only supported
       for protocol schemes: chrome, chrome-extension, chrome-untrusted, data,
       http, https, isolated-app.
   Inlining the source does not help either: `<script type="module">` is
   subject to the same rule whether its code came from a URL or not, and each
   module page then fetches scene.json, a 3.7 MB depth.bin and up to seven
   .glb files, which are XHR and blocked for the same reason.  So the honest
   answer is a one-command launcher, and this is where it is said out loud.
   live3d/RESULTS.md, "How to open it". */
if (location.protocol === 'file:') {
  var e = document.getElementById('err');
  e.style.display = 'block';
  e.textContent =
    'This page is open over file:// and that cannot work.\n\n' +
    'Chrome refuses the ES module load outright (CORS, origin "null"), and ' +
    'each module close-up also fetches scene.json, a 3.7 MB depth.bin and up ' +
    'to seven .glb files, which are blocked by the same rule.  Nothing the ' +
    'page can do changes that.\n\n' +
    'Run this instead, from the repo root:\n' +
    '    ./live3d/run.sh\n\n' +
    'or, by hand:\n' +
    '    cd <repo>/2026 && python3 -m http.server 8777\n' +
    '    open http://localhost:8777/live3d/';
}
</script>
