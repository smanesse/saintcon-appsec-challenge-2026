<!doctype html>
<!-- SAINTCON 2026 — PER-MODULE CLOSE-UP TEMPLATE.

     COPY THIS DIRECTORY to live3d/modules/<CODE>/ and edit module.js.
     Do not edit live3d/app.js: eight agents editing one file is how the
     convention drift in README section 7 happened.  The fleet integrator wires
     the finished modules into app.js afterwards; your deliverable is a page
     that stands alone and passes the checks.

     SERVE FROM THE REPO ROOT:
         cd /path/to/saintcon/2026
         python3 -m http.server 8777
         open http://localhost:8777/live3d/modules/<CODE>/

     THE LAYER STACK BELOW IS THE OCCLUSION MECHANISM.  Do not reorder it, do
     not add a layer between #css3d and #glFront, and do not put content text
     anywhere but #css3d.  live3d/design/TEXT_OCCLUSION.md is the decision;
     live3d/CONVERSION_BRIEF.md is the recipe. -->
<meta charset="utf-8">
<title>Optical Sensor Array</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#02030a;overflow:hidden;color:#9fb6d0;
    font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  #viewport{position:fixed;left:0;right:0;top:0;bottom:0;overflow:hidden}
  .stage{position:absolute;left:0;top:0;width:1280px;height:720px;
    transform-origin:0 0}
  .stage>*{position:absolute;left:0;top:0}
  .layer{width:1280px;height:720px;pointer-events:none;user-select:none;
    -webkit-user-drag:none}

  /* ------------------------------------------------ THE SANDWICH, z 1..5
     <img> baked plate                                 1
     canvas #gl        everything BEHIND the readouts  2
     div    #css3d     the DOM readouts                3
     canvas #glFront   everything IN FRONT of them     4
     div    #hots      pointer targets                 5                     */
  #plate  {z-index:1}
  #gl     {z-index:2}
  #css3d  {z-index:3;pointer-events:none}
  #glFront{z-index:4}
  #hots   {z-index:5;width:1280px;height:720px}
  .hot{position:absolute;cursor:pointer;border:1px solid transparent;
    border-radius:3px;transition:background .12s,border-color .12s}
  /* HOTSPOT HOVER = a soft edge glow, not a filled box (owner finding
     f-mv6t5d1h).  No border colour, no fill: only a low-alpha, blurred
     box-shadow, tinted to sit in the scene's light.  The element's box,
     border width and radius are untouched, so the hotspot geometry the
     occlusion split depends on does not move.  KEYBOARD FOCUS is a separate,
     stronger cue -- a 2 px outline with a dark gap -- so focus and hover are
     never confused. */
  .hot{transition:box-shadow .15s ease,background .12s,border-color .12s}
  .hot:hover{border-color:transparent;background:transparent;
    box-shadow:0 0 0 1px rgba(140,195,255,.20),
      0 0 14px 3px rgba(140,195,255,.26),
      inset 0 0 12px rgba(140,195,255,.14)}
  .hot:focus-visible{outline:2px solid #cfe9ff;outline-offset:3px;
    border-color:transparent;background:transparent;
    box-shadow:0 0 0 1px rgba(2,6,14,.9),0 0 16px 4px rgba(150,205,255,.38)}
  .hot:focus:not(:focus-visible){outline:none}
  body.debug .hot{border-color:rgba(63,224,255,.55);
    background:rgba(63,224,255,.06)}

  /* ---- DOM content text ----
     Ink colour is measured off Blender's own render of your own type.  For KVS
     that is rgb(122,113,107), a WARM grey, because albedo-neutral ink under six
     warm area lights renders warm.  MEASURE YOUR MODULE'S; do not copy KVS's
     and do not "fix" it to neutral.
     TAKE THE MEDIAN OVER alpha > 0.5, WITH NO COLOUR TRANSFORM.  The recipe
     this comment used to give -- "the most-common fully-opaque pixel" -- fails
     twice and silently on small type: (a) nothing in MTA's type is fully
     opaque, max alpha 224, so a >0.996 threshold returns an EMPTY set, and the
     mode over the ~20 px that survive a lower one picked a specular highlight;
     (b) bpy hands `image.pixels` back ALREADY display-encoded for an 8-bit sRGB
     PNG, so applying an sRGB encode on top turned the true rgb(85,77,71) into a
     wholly plausible rgb(157,150,146).  Cross-check against the PNG bytes read
     with the stdlib decoder.  (Blender writes STRAIGHT alpha -- verified: mean
     RGB is flat across every alpha bucket -- so a half-covered pixel still
     carries the ink's own colour and belongs in the median.) */
  /* ---- THE VENDORED FACE ----  FLEET RULE, decided once, see
     CONVERSION_BRIEF.md section 7.6.  Every baked label in this project is
     Courier New Bold (cockpit/modules/*/build.py's mono_font() loads
     "/System/Library/Fonts/Supplemental/Courier New Bold.ttf"), which is a
     Monotype face that may not be redistributed.  The Docker image has neither
     it nor any guarantee of a mono face at all, so a face MUST be bundled --
     and it is listed FIRST, ahead of Courier New, so that what is measured on
     a developer's Mac is byte-for-byte what the container renders.  A stack
     that resolves differently in the two places is how the Retina bug hid for
     a week (README 16.5).
     Courier Prime Bold, SIL OFL 1.1, is the chosen face; the measurement that
     chose it is in the brief.  Do NOT swap in fonts/MatrixVCR5x7 -- it is a
     5x7 pixel face and the engraved labels 3 mm away are Courier. */
  /* IPM's three readouts all lie on BRASS rails and all use the module's own
     ipm_ink material, so the measured colours are close but not equal -- the
     four close lights do not light the panel evenly.  Measured (median over
     alpha > 0.5 of Blender's own render of THIS module's type, no colour
     transform): source rgb(108,99,91), output rgb(105,96,88), develop
     rgb(103,94,87).  module.js sets each element's colour from
     scene.json -> text_planes[].ink; this default is the source plane's, so
     the page is never wrong even for the frame before that runs. */
  .readout{overflow:hidden;color:rgb(108,99,91);
    font-family:"Courier Prime","Courier New",ui-monospace,Menlo,monospace;
    font-weight:700;white-space:pre;letter-spacing:0}
  .readout .lines{position:absolute}
  .readout.editing{overflow:visible}
  .hot.well{cursor:text}
  body.notext .readout{visibility:hidden}

  #bar{position:fixed;left:0;right:0;bottom:0;height:38px;display:none;
    gap:8px;align-items:center;padding:0 10px;background:#0a0d14;
    border-top:1px solid #1d2836;z-index:20}
  /* white-space:nowrap and flex:none ARE NOT COSMETIC.  #bar is a 38 px flex
     row; without them a long #note shrinks the buttons until their labels wrap
     to two lines, the buttons grow to 45 px and OVERFLOW THE BAR UPWARDS by
     3 px -- into the 1280x720 stage rect the capture harness clips.  Toggling
     the split changes a button's colour, so the two screenshots then differ by
     406 px outside the ground truth and check_occlusion.py's question 3 fails
     for a toolbar.  getBoundingClientRect on #bar still says 720, so it looks
     correct; only the button moves.  Every module writes a #note. */
  button{font:inherit;letter-spacing:.12em;text-transform:uppercase;
    white-space:nowrap;flex:none;
    padding:5px 10px;background:#131a26;color:#9fb6d0;border:1px solid #24405e;
    border-radius:3px;cursor:pointer}
  button:hover{color:#d8e8fa;border-color:#3d6a96}
  button.on{background:#c79a2e;color:#161208;border-color:#f2d67a}
  #note{margin-left:auto;color:#5f7590;font-size:10.5px;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #err{position:fixed;inset:auto 12px 48px 12px;z-index:40;display:none;
    background:#2a0d0d;border:1px solid #a33;color:#ffb4b4;padding:10px 12px;
    white-space:pre-wrap;font-size:12px}

  /* ------------------------------------------------------------ EMBED MODE
     `?embed=1` is how live3d/index.html -- the cockpit -- opens this page in an
     iframe when the owner dives into this module.  Three declarations, and
     each of them is load-bearing:

       * TRANSPARENT BACKGROUND.  This module's plate.png is FILM-TRANSPARENT
         (trap 20: OTA's is only 35% opaque) and is meant to composite over the
         dimmed wide cockpit shot, which lives in the PARENT document.  An
         opaque #02030a here would put black holes through the middle of the
         close-up -- the exact bug README 16.2 records.
       * NO TOOLBAR, and #viewport to the bottom edge, so the iframe is exactly
         the 1280x720 stage and the cockpit's own transition can scale it as a
         single rectangle.  The cockpit carries the equivalent buttons and
         drives them through this page's own window.__occ.
       * NOTHING ELSE.  The renderer, the split, the planes, the constants and
         the session model are byte-identical in the two modes; embed mode
         changes only what is around the stage.  Nothing the checkers measure
         is inside a `.embed` rule -- the harness never sets it. */
  html.embed,html.embed body{background:transparent}
  html.embed #viewport{bottom:0}
  html.embed #bar{display:none}
  html.embed h1.module-title{display:none}

  /* ---- DEV TOOLBAR GATE (owner finding f-mv6syyni 4.2) ----
     The bottom #bar (dom text / occlusion split / show planes / show hotspots)
     is a developer tool.  It is `display:none` above and `?dev=1` turns it on:
     the head script adds class `dev` for ?dev=1 on this page's own URL or on the
     cockpit page that embeds it.  Default off, never stored.  Standalone dev
     gives the 38 px back to the bar; in an embed the bar overlays the bottom of
     the 1280x720 stage instead, so the cockpit's transition rect is unchanged. */
  html.dev #bar{display:flex}
  html.dev:not(.embed) #viewport{bottom:38px}

  /* HELD PAPER.  The work order and the print are DOM cards that module.js
     lays in 3D on the panel's own basis by a second CSS3D layer (#held), the
     same mechanism as FMM's manifest sheet and cargo slip.  At rest each is
     exactly its home on the array (the SOURCE rail, the developing plate);
     picked up it eases toward the camera.  Lifted paper is in front of every
     piece of geometry, so #held sits above #hots and needs no occlusion split.
     The elements' px sizes are fixed because the 3D scale is solved from them
     (module.js ORDER / PRINT). */
  #held{z-index:6;width:1280px;height:720px;pointer-events:none}
  body.notext #held{visibility:hidden}
  .paper{pointer-events:auto;background:#e8e2d2;color:#2a2622;
    border:1px solid #8d8368;border-radius:2px;
    box-shadow:0 10px 34px rgba(0,0,0,.62),0 0 0 1px rgba(0,0,0,.35);
    font:700 14px/1.45 "Courier Prime","Courier New",ui-monospace,Menlo,monospace;
    display:flex;flex-direction:column}
  /* NO overflow:hidden ON .paper.  On a 3D-transformed card Chrome still
     draws it but stops hit-testing it entirely: elementsFromPoint() over the
     lifted card returned #hots underneath, so not one field or button took a
     click.  Scrolling regions INSIDE the card are fine. */
  /* WORK ORDER TAB.  The SOURCE rail is the order's home on the array, but it
     is a small target and nothing says "click me" once the order is down.
     This tab sits off the panel, under the module title, and toggles the
     order.  pose() hides it with the rest of the screen chrome. */
  #bOrder{z-index:7;left:16px;top:56px;display:flex;align-items:center;gap:9px;
    padding:9px 16px 9px 12px;background:#e8e2d2;color:#2a2622;
    border:1px solid #8d8368;border-left:5px solid #b8892f;border-radius:2px;
    box-shadow:0 6px 18px rgba(0,0,0,.55);
    font:700 15px/1 "Courier Prime","Courier New",ui-monospace,Menlo,monospace;
    letter-spacing:.14em}
  #bOrder::before{content:"\2630";font-size:16px;letter-spacing:0}
  #bOrder:hover{background:#f4efe2;color:#2a2622;border-color:#5f5943;border-left-color:#c99a3c}
  #bOrder.on{background:#2a2622;color:#e8e2d2;border-color:#2a2622;border-left-color:#b8892f}
  #bOrder:focus-visible{outline:2px solid #1d4f8a;outline-offset:2px}
  #bOrder[hidden]{display:none}
  .paper[hidden]{display:none}
  .paper [hidden]{display:none}
  #ipm-bench{width:500px;height:500px;padding:20px 18px 10px 18px}
  #ipm-bench .clamp{position:absolute;left:50%;top:-12px;width:110px;height:24px;
    margin-left:-55px;border-radius:3px;
    background:linear-gradient(180deg,#d9b25a,#8a6420);box-shadow:0 2px 3px rgba(0,0,0,.45)}
  /* the print: photographic paper, a white border round the picture */
  #ipmPrint{width:420px;height:560px;padding:12px 16px 10px 16px;background:#f4f1ea}
  .paper .phd{display:flex;align-items:center;gap:10px;letter-spacing:.16em;
    border-bottom:1px solid #8d8368;padding-bottom:4px;margin-bottom:4px;flex:none}
  .paper .phd .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  #ipm-bench .phd .ttl{text-transform:uppercase}
  .paper .sz{font-weight:400;color:#6a6252;font-size:13px;letter-spacing:.04em}
  .paper .lab-health{font-size:12px;letter-spacing:.08em;color:#6a6252}
  .paper .lab-health::before{content:"\25CF  "}
  .paper .lab-health.up{color:#2f6b2a}
  .paper .lab-health.down{color:#8a2b22}
  .paper .pclose{width:28px;height:28px;padding:0;display:flex;align-items:center;
    justify-content:center;font-size:20px;line-height:1;letter-spacing:0;flex:none}
  .paper .hint{margin:1px 0 3px;color:#6a6252;font-weight:400;font-size:13px;line-height:1.3}
  .paper .lab-sec{flex:none;border-radius:2px}
  .paper .lab-sec.grow{flex:1;min-height:0;display:flex;flex-direction:column}
  .paper .lab-sec.flash{animation:ipmflash 1s ease-out}
  @keyframes ipmflash{from{background:rgba(184,137,47,.32)}to{background:transparent}}
  .paper .phd2{display:flex;align-items:center;letter-spacing:.14em;
    border-bottom:1px solid #c4bba3;padding:5px 0 3px;margin:3px 0 5px;
    color:#6a6252;font-size:12px;font-weight:700}
  .paper .phd2 .n{display:inline-block;width:17px;height:17px;margin-right:7px;
    line-height:16px;text-align:center;border:1px solid #8d8368;border-radius:50%;
    font-size:11px;letter-spacing:0;color:#2a2622}
  .paper button{font:inherit;font-size:13px;font-weight:700;letter-spacing:.1em;
    padding:4px 10px;border-radius:2px;cursor:pointer;
    background:#c9bf9f;color:#2a2622;border:1px solid #8d8368}
  .paper button:hover:not(:disabled){background:#d8cfb2;border-color:#5f5943}
  .paper button:disabled{opacity:.45;cursor:default}
  .paper button.go{background:#b8892f;border-color:#7a5a17;color:#1a1508;padding:6px 16px}
  .paper button.go:hover:not(:disabled){background:#c99a3c}
  .paper button.on{background:#2a2622;color:#e8e2d2;border-color:#2a2622}
  .paper button.sm{padding:2px 8px;font-size:12px;letter-spacing:.06em}
  .paper button:focus-visible,.paper input:focus-visible,.paper select:focus-visible{
    outline:2px solid #1d4f8a;outline-offset:1px}
  .paper .seg{display:flex;gap:4px;margin:0 0 5px}
  .paper .seg button{flex:1;padding:3px 0}
  .paper .prow{display:grid;grid-template-columns:74px 1fr;column-gap:8px;
    align-items:center;margin:0 0 5px}
  .paper .pk{color:#6a6252;letter-spacing:.08em;font-size:13px}
  .paper .cell{display:flex;gap:5px;align-items:center;min-width:0}
  .paper .cell .seg{margin:0;flex:1}
  .paper .cell .x{color:#6a6252;font-size:12px;letter-spacing:.06em;flex:none}
  .paper input,.paper select{font:inherit;font-weight:700;letter-spacing:.03em;
    background:#dcd5c3;color:#2a2622;border:1px solid #b3ab92;border-radius:2px;
    padding:3px 6px;width:100%;min-width:0}
  .paper input.num{width:62px;flex:none}
  .paper input.fmt{width:80px;flex:none}
  .paper input[type=file]{padding:1px 3px;font-size:12px;font-weight:400}
  .paper input::placeholder{color:#8d8368;font-weight:400}
  .paper input:disabled{opacity:.45}
  .paper .lab-req{display:block;padding:4px 7px;background:#dcd5c3;
    border:1px solid #b3ab92;border-radius:2px;color:#1a1508;word-break:break-all;
    font-size:13px}
  .paper .lab-reqbody{margin:2px 0 0;color:#3a352c;font-weight:400;font-size:13px;
    word-break:break-all}
  .paper .pbtns{display:flex;gap:7px;margin-top:8px;align-items:center;flex:none}
  .paper .pbtns .sp{flex:1}
  .paper .pstatus{flex:none;margin-top:6px;min-height:1.4em;font-size:13px;
    font-weight:400;color:#3a352c;overflow:hidden;display:-webkit-box;
    -webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
  .paper .pstatus.ok{color:#33572b}
  .paper .pstatus.err{color:#a4402c}
  .paper .pstatus.busy{color:#6a6252}
  #ipmPrint .photo{flex:none;height:230px;display:flex;align-items:center;
    justify-content:center;margin:2px 0 4px;border:1px solid #c4bba3;
    background:repeating-conic-gradient(#e2ddd0 0 25%,#d6cfbd 0 50%) 0 0/14px 14px}
  #ipmPrint .photo img{max-width:100%;max-height:100%;min-width:96px;min-height:96px;
    object-fit:contain;image-rendering:pixelated}
  #ipmPrint .lab-resp{flex:1;min-height:0;overflow:auto}
  .paper .kv{display:grid;grid-template-columns:84px 1fr;gap:0 8px;margin:0;
    font-weight:400;font-size:13px}
  .paper .kv dt{color:#6a6252}
  .paper .kv dd{margin:0;color:#2a2622;word-break:break-all}
  .paper .batch{display:flex;flex-direction:column;gap:3px;margin:5px 0 0}
  .paper .batch button,.paper .chips button{max-width:100%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;text-align:left;letter-spacing:0;
    text-transform:none}
  .paper details{margin-top:4px}
  .paper summary{cursor:pointer;color:#6a6252;font-size:12px;letter-spacing:.1em}
  .paper pre{margin:3px 0 0;padding:4px 7px;max-height:120px;overflow:auto;
    background:#dcd5c3;border:1px solid #b3ab92;font:400 12px/1.35 inherit;
    font-family:inherit;color:#3a352c;white-space:pre-wrap;word-break:break-all}
  .paper .chips{display:flex;flex-wrap:wrap;gap:4px;margin:0;max-height:52px;overflow:auto}
</style>

<!-- The telltale mast's screen-space caption and detail panel.  CHROME, a
     sibling layer over the front canvas, and deliberately NOT a declared
     readout plane.  That is what keeps check_occlusion.py question 5, the
     dial-face rule and check_text.py NOT ENGAGED by the mast -- IPM still
     declares exactly THREE readout planes, the same three it always did.
     live3d/mast.css is shared by all nine modules and its font URLs resolve
     against ITS OWN location. -->
<link rel="stylesheet" href="../../mast.css">
<script>
/* Set BEFORE the body is laid out, so embed mode never flashes an opaque
   background over the cockpit behind it.  No innerHTML, no markup assignment
   -- one className on the root element. */
(function () {
  var c = [];
  var flag = function (q) { return /(^|[?&])dev=1(&|$)/.test(String(q || '').replace(/^\?/, '')); };
  if (location.search.indexOf('embed') >= 0) c.push('embed');
  /* ?dev=1 -- developer toolbar.  Own URL, or the cockpit page's URL when this
     page is the cockpit's iframe (same convention as app.js / FMM).  Never read
     from storage, so it cannot stay on by accident. */
  var dev = flag(location.search);
  try {
    if (!dev && window.parent && window.parent !== window) dev = flag(window.parent.location.search);
  } catch (e) { /* cross-origin parent: no flag */ }
  if (dev) c.push('dev');
  if (c.length) document.documentElement.className = c.join(' ');
})();
</script>
