<!doctype html>
<!-- SAINTCON 2026 — KVS close-up (Key/Value Store: CORE BANK).

     THIS PAGE IS THE PORT OF live3d/app.js's KVS HALF, made at integration
     time.  app.js was the reference implementation AND the cockpit shell in
     one file, which is why README section 16.8 called it "still a KVS-specific
     monolith".  It is now the cockpit shell only: the nine close-ups are nine
     standalone pages under live3d/modules/, this one included, and the cockpit
     embeds whichever one you dive into.

     Nothing about KVS's rendering changed in the port -- same scene.json, same
     depth composite, same split, same one readout plane, same session model.
     What it GAINED is the fleet-standard `window.__occ` contract, so KVS can
     finally be swept with check/sweep_knob.mjs and scored by the same commands
     as the other eight.  See live3d/RESULTS.md.

     SERVE FROM THE REPO ROOT:
         cd /path/to/saintcon/2026
         python3 -m http.server 8777
         open http://localhost:8777/live3d/modules/<CODE>/

     THE LAYER STACK BELOW IS THE OCCLUSION MECHANISM.  Do not reorder it, do
     not add a layer between #css3d and #glFront, and do not put content text
     anywhere but #css3d.  live3d/design/TEXT_OCCLUSION.md is the decision;
     live3d/CONVERSION_BRIEF.md is the recipe. -->
<meta charset="utf-8">
<title>Core Memory Banks</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#02030a;overflow:hidden;color:#9fb6d0;
    font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  #viewport{position:fixed;left:0;right:0;top:0;bottom:0;overflow:hidden}
  .stage{position:absolute;left:0;top:0;width:1280px;height:720px;
    transform-origin:0 0}
  .stage>*{position:absolute;left:0;top:0}
  .layer{width:1280px;height:720px;pointer-events:none;user-select:none;
    -webkit-user-drag:none}

  /* ------------------------------------------------ THE SANDWICH, z 1..5
     <img> baked plate                                 1
     canvas #gl        everything BEHIND the readouts  2
     div    #css3d     the DOM readouts                3
     canvas #glFront   everything IN FRONT of them     4
     div    #hots      pointer targets                 5                     */
  #plate  {z-index:1}
  #gl     {z-index:2}
  #css3d  {z-index:3;pointer-events:none}
  #glFront{z-index:4}
  #hots   {z-index:5;width:1280px;height:720px}
  .hot{position:absolute;cursor:pointer;border:1px solid transparent;
    border-radius:3px;transition:background .12s,border-color .12s}
  /* Ghost fields live in #hots because #css3d is pointer-events:none.
     Opacity 0: the platen / tape paint via textContent, not these nodes. */
  .kvs-ghost{position:absolute;inset:0;width:100%;height:100%;opacity:0;
    border:0;padding:0;margin:0;background:transparent;color:transparent;
    caret-color:transparent;outline:none;resize:none;font:inherit;
    pointer-events:auto}
  /* HOTSPOT HOVER = a soft edge glow, not a filled box (owner finding
     f-mv6t5d1h).  No border colour, no fill: only a low-alpha, blurred
     box-shadow, tinted to sit in the scene's light.  The element's box,
     border width and radius are untouched, so the hotspot geometry the
     occlusion split depends on does not move.  KEYBOARD FOCUS is a separate,
     stronger cue -- a 2 px outline with a dark gap -- so focus and hover are
     never confused. */
  .hot{transition:box-shadow .15s ease,background .12s,border-color .12s}
  .hot:hover{border-color:transparent;background:transparent;
    box-shadow:0 0 0 1px rgba(140,195,255,.20),
      0 0 14px 3px rgba(140,195,255,.26),
      inset 0 0 12px rgba(140,195,255,.14)}
  .hot:focus-visible{outline:2px solid #cfe9ff;outline-offset:3px;
    border-color:transparent;background:transparent;
    box-shadow:0 0 0 1px rgba(2,6,14,.9),0 0 16px 4px rgba(150,205,255,.38)}
  .hot:focus:not(:focus-visible){outline:none}
  body.debug .hot{border-color:rgba(63,224,255,.55);
    background:rgba(63,224,255,.06)}

  /* ---- DOM content text ----
     Ink colour is measured off Blender's own render of your own type.  For KVS
     that is rgb(122,113,107), a WARM grey, because albedo-neutral ink under six
     warm area lights renders warm.  MEASURE YOUR MODULE'S; do not copy KVS's
     and do not "fix" it to neutral.
     TAKE THE MEDIAN OVER alpha > 0.5, WITH NO COLOUR TRANSFORM.  The recipe
     this comment used to give -- "the most-common fully-opaque pixel" -- fails
     twice and silently on small type: (a) nothing in MTA's type is fully
     opaque, max alpha 224, so a >0.996 threshold returns an EMPTY set, and the
     mode over the ~20 px that survive a lower one picked a specular highlight;
     (b) bpy hands `image.pixels` back ALREADY display-encoded for an 8-bit sRGB
     PNG, so applying an sRGB encode on top turned the true rgb(85,77,71) into a
     wholly plausible rgb(157,150,146).  Cross-check against the PNG bytes read
     with the stdlib decoder.  (Blender writes STRAIGHT alpha -- verified: mean
     RGB is flat across every alpha bucket -- so a half-covered pixel still
     carries the ink's own colour and belongs in the median.) */
  /* ---- THE VENDORED FACE ----  FLEET RULE, decided once, see
     CONVERSION_BRIEF.md section 7.6.  Every baked label in this project is
     Courier New Bold (cockpit/modules/*/build.py's mono_font() loads
     "/System/Library/Fonts/Supplemental/Courier New Bold.ttf"), which is a
     Monotype face that may not be redistributed.  The Docker image has neither
     it nor any guarantee of a mono face at all, so a face MUST be bundled --
     and it is listed FIRST, ahead of Courier New, so that what is measured on
     a developer's Mac is byte-for-byte what the container renders.  A stack
     that resolves differently in the two places is how the Retina bug hid for
     a week (README 16.5).
     Courier Prime Bold, SIL OFL 1.1, is the chosen face; the measurement that
     chose it is in the brief.  Do NOT swap in fonts/MatrixVCR5x7 -- it is a
     5x7 pixel face and the engraved labels 3 mm away are Courier. */
  /* KVS's ink, MEASURED off Blender's own render of this type
     (gt_platen0.png): rgb(122,113,107).  It is a WARM grey because
     albedo-neutral ink under six warm area lights renders warm.  Do not
     "fix" it to neutral. */
  .readout{overflow:hidden;color:rgb(122,113,107);
    font-family:"Courier Prime","Courier New",ui-monospace,Menlo,monospace;
    font-weight:700;white-space:pre;letter-spacing:0}
  .readout .lines{position:absolute}
  body.notext .readout{visibility:hidden}

  /* ---- KVS's SCREEN-SPACE HUD ----
     These four values are the session's own state.  They are HUD, not
     instrument content: they sit in screen space in #chrome, a sibling of the
     stage layers, and are deliberately NOT declared readout planes -- no check
     scopes to them and none should.  The instrument's own content text is the
     transcript on the console face, which IS a declared plane. */
  #chrome{z-index:6;pointer-events:none;width:1280px;height:720px}
  .hud{position:absolute;pointer-events:none;background:rgba(4,8,16,.82);
    border:1px solid #3a2f16;border-radius:3px;padding:6px 9px;
    line-height:1.75;white-space:pre;font-size:12px}
  #roL{left:24px;bottom:22px}
  .hud b{color:#f2d67a;font-weight:400}
  .hud i{color:#5f7590;font-style:normal}
  #banner{position:absolute;left:24px;top:20px;font-size:13px;
    letter-spacing:.24em;color:#f2d67a;text-shadow:0 0 12px rgba(0,0,0,.9)}
  #banner span{display:block;font-size:10.5px;letter-spacing:.18em;
    color:#8fa6c0;margin-top:3px}
  body.notext .hud b,body.notext #banner{visibility:hidden}

  /* HELD PAPER.  The bank ledger is DOM placed in 3D on the console face
     basis by a second CSS3D layer (#held).  It lifts off the drawer labels
     along the top of the bank and comes toward the camera over the left
     bulkhead, so the platen, the key and the reel stay usable.  It is in front
     of every piece of geometry, so #held sits above #hots and needs no
     occlusion split.  The host is pointer-events:none; only the paper takes
     the pointer. */
  #held{z-index:6;width:1280px;height:720px;pointer-events:none}
  .paper{pointer-events:auto;color:#2a2622;
    border:1px solid #8d8368;border-radius:2px;display:flex;flex-direction:column;
    font-family:"Courier Prime","Courier New",ui-monospace,Menlo,monospace;
    font-weight:700;font-size:17px;line-height:1.4;letter-spacing:0;
    box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.3)}
  .paper[hidden]{display:none}
  /* a ledger card: buff stock, sprocket holes down the left like the platen */
  #kvsLedger{width:560px;height:740px;padding:14px 18px 10px 30px;
    background:radial-gradient(circle at 12px 18px,#6f6656 2.5px,transparent 3px) 0 0/24px 36px repeat-y,
      linear-gradient(90deg,transparent 22px,#c9a66b 22px 23px,transparent 23px),
      #efe6cc}
  #ledgerCard{display:flex;flex-direction:column;flex:1;min-height:0;outline:none}
  .paper .phd{display:flex;align-items:center;gap:10px;letter-spacing:.18em;
    border-bottom:1px solid #8d8368;padding-bottom:5px;margin-bottom:8px;flex:none}
  .paper .phd .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .paper .sz{font-weight:400;color:#6a6252;font-size:14px;letter-spacing:.04em;white-space:nowrap}
  .paper .prow{display:flex;gap:7px;align-items:center;margin:0 0 5px;flex:none}
  .paper .pk{color:#6a6252;letter-spacing:.1em;flex:none;width:58px;font-size:14px;
    text-transform:uppercase}
  .paper .sect{flex:none;margin:6px 0 5px;color:#6a6252;font-size:14px;letter-spacing:.18em;
    border-top:1px dashed #8d8368;padding-top:5px;display:flex;gap:10px}
  .paper .sect span:first-child{flex:1}
  .paper input,.paper textarea{font:inherit;font-weight:700;
    background:#e2d8bb;color:#2a2622;border:1px solid #b3a581;
    border-radius:2px;padding:3px 7px;width:100%;min-width:0;flex:1}
  .paper textarea{resize:none;line-height:1.3}
  .paper input.ttl{flex:0 0 76px;width:76px}
  .paper button{font:inherit;font-size:14px;font-weight:700;letter-spacing:.12em;
    padding:5px 11px;border-radius:2px;cursor:pointer;text-transform:uppercase;
    background:#d3c39a;color:#2a2622;border:1px solid #8d8368;white-space:nowrap;flex:none}
  .paper button:hover:not(:disabled){background:#e0d2ab;border-color:#5f5943}
  .paper button:disabled{opacity:.45;cursor:default}
  .paper button.go{background:#b8892f;border-color:#7a5a17;color:#1a1508}
  .paper button.go:hover:not(:disabled){background:#c99a3c}
  .paper .pclose{width:30px;height:30px;padding:0;display:flex;align-items:center;
    justify-content:center;font-size:22px;line-height:1;letter-spacing:0;text-transform:none}
  .paper button:focus-visible,.paper input:focus-visible,.paper textarea:focus-visible,
  .paper [role=option]:focus-visible{outline:2px solid #1d4f8a;outline-offset:1px}
  /* the two faces of the card: KEYS and TAPE, tabbed like index cards */
  .paper .tabs{display:flex;gap:4px;flex:none;margin-bottom:8px}
  .paper .tabs button{flex:1;background:#e2d8bb;border-bottom-width:3px}
  .paper .tabs button[aria-selected=true]{background:#b8892f;border-color:#7a5a17;color:#1a1508}
  .paper .face{display:flex;flex-direction:column;flex:none}
  .paper .face[hidden]{display:none}
  /* the drawer index: one row per key, click to read it */
  #ledgerKeys{flex:none;height:150px;overflow:auto;margin:0 0 6px;padding:2px 0;
    background:rgba(250,246,234,.8);border:1px solid #b3a581;border-radius:2px;
    font:400 16px/1.45 "Courier Prime","Courier New",ui-monospace,Menlo,monospace}
  #ledgerKeys div{padding:0 8px;cursor:pointer;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  #ledgerKeys div:hover{background:#e2d8bb}
  #ledgerKeys div.on{background:#d3c39a;font-weight:700}
  #ledgerKeys .empty{color:#6a6252;cursor:default}
  #ledgerKeys .empty:hover{background:none}
  #ledgerVal{height:58px}
  #ledgerScript{height:150px}
  .paper .btns{display:flex;gap:8px;align-items:center;flex:none;margin:2px 0 0}
  .paper .btns .gap{flex:1;min-width:0;font-size:13px;font-weight:400;color:#6a6252;
    letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* the printout: what the bank said */
  #ledgerLines{flex:1;min-height:0;overflow:auto;margin:6px 0 0;padding:6px 8px;
    background:rgba(250,246,234,.8);border:1px solid #b3a581;border-radius:2px;
    font:400 16px/1.35 "Courier Prime","Courier New",ui-monospace,Menlo,monospace;
    white-space:pre-wrap;word-break:break-word;color:#2a2622}
  #ledgerLines .sent{color:#1d4f8a}
  #ledgerLines .bad{color:#a4402c}
  #ledgerLines .empty{color:#6a6252}
  .paper .preply{flex:none;display:flex;align-items:center;gap:8px;margin-top:6px;
    padding-top:4px;border-top:1px solid #c4b48e}
  #ledgerReply{flex:1;min-width:0;font-size:14px;font-weight:400;color:#3a352c;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.5em}
  #ledgerReply.err{white-space:normal;line-height:1.35;color:#a4402c}
  #ledgerReply.ok{color:#33572b}
  #ledgerReply.busy{color:#6a6252}
  body.notext #held{visibility:hidden}

  #bar{position:fixed;left:0;right:0;bottom:0;height:38px;display:none;
    gap:8px;align-items:center;padding:0 10px;background:#0a0d14;
    border-top:1px solid #1d2836;z-index:20}
  /* white-space:nowrap and flex:none ARE NOT COSMETIC.  #bar is a 38 px flex
     row; without them a long #note shrinks the buttons until their labels wrap
     to two lines, the buttons grow to 45 px and OVERFLOW THE BAR UPWARDS by
     3 px -- into the 1280x720 stage rect the capture harness clips.  Toggling
     the split changes a button's colour, so the two screenshots then differ by
     406 px outside the ground truth and check_occlusion.py's question 3 fails
     for a toolbar.  getBoundingClientRect on #bar still says 720, so it looks
     correct; only the button moves.  Every module writes a #note. */
  button{font:inherit;letter-spacing:.12em;text-transform:uppercase;
    white-space:nowrap;flex:none;
    padding:5px 10px;background:#131a26;color:#9fb6d0;border:1px solid #24405e;
    border-radius:3px;cursor:pointer}
  button:hover{color:#d8e8fa;border-color:#3d6a96}
  button.on{background:#c79a2e;color:#161208;border-color:#f2d67a}
  #note{margin-left:auto;color:#5f7590;font-size:10.5px;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #err{position:fixed;inset:auto 12px 48px 12px;z-index:40;display:none;
    background:#2a0d0d;border:1px solid #a33;color:#ffb4b4;padding:10px 12px;
    white-space:pre-wrap;font-size:12px}

  /* ------------------------------------------------------------ EMBED MODE
     `?embed=1` is how live3d/index.html -- the cockpit -- opens this page in an
     iframe when the owner dives into this module.  Three declarations, and
     each of them is load-bearing:

       * TRANSPARENT BACKGROUND.  This module's plate.png is FILM-TRANSPARENT
         (trap 20: OTA's is only 35% opaque) and is meant to composite over the
         dimmed wide cockpit shot, which lives in the PARENT document.  An
         opaque #02030a here would put black holes through the middle of the
         close-up -- the exact bug README 16.2 records.
       * NO TOOLBAR, and #viewport to the bottom edge, so the iframe is exactly
         the 1280x720 stage and the cockpit's own transition can scale it as a
         single rectangle.  The cockpit carries the equivalent buttons and
         drives them through this page's own window.__occ.
       * NOTHING ELSE.  The renderer, the split, the planes, the constants and
         the session model are byte-identical in the two modes; embed mode
         changes only what is around the stage.  Nothing the checkers measure
         is inside a `.embed` rule -- the harness never sets it. */
  html.embed,html.embed body{background:transparent}
  html.embed #viewport{bottom:0}
  html.embed #bar{display:none}
  html.embed h1.module-title{display:none}

  /* ---- DEV TOOLBAR GATE (owner finding f-mv6syyni 4.2) ----
     The bottom #bar (dom text / occlusion split / show planes / show hotspots)
     is a developer tool.  It is `display:none` above and `?dev=1` turns it on:
     the head script adds class `dev` for ?dev=1 on this page's own URL or on the
     cockpit page that embeds it.  Default off, never stored.  Standalone dev
     gives the 38 px back to the bar; in an embed the bar overlays the bottom of
     the 1280x720 stage instead, so the cockpit's transition rect is unchanged. */
  html.dev #bar{display:flex}
  html.dev:not(.embed) #viewport{bottom:38px}
</style>
<!-- The refit port's screen-space docket.  It is CHROME, not instrument
     content: a sibling layer above the front canvas, in the same class as the
     .hud panel above, and deliberately NOT a declared readout plane.
     live3d/refit.css is shared by all nine modules and its font URLs resolve
     against ITS OWN location, so the relative depth of this page is
     irrelevant. -->
<link rel="stylesheet" href="../../refit.css">
<!-- The telltale mast's screen-space caption.  Same class of thing as the
     .hud panel and the refit docket above: CHROME, a sibling layer over the
     front canvas, and deliberately NOT a declared readout plane.  That is what
     keeps check_occlusion.py question 5, the dial-face rule and check_text.py
     NOT ENGAGED by the status indicator rather than merely satisfied.
     live3d/mast.css is shared by all nine modules and its font URLs resolve
     against ITS OWN location. -->
<link rel="stylesheet" href="../../mast.css">
<link rel="stylesheet" href="../../service-rebuild.css">
<script>
/* Set BEFORE the body is laid out, so embed mode never flashes an opaque
   background over the cockpit behind it.  No innerHTML, no markup assignment
   -- one className on the root element. */
(function () {
  var c = [];
  var flag = function (q) { return /(^|[?&])dev=1(&|$)/.test(String(q || '').replace(/^\?/, '')); };
  if (location.search.indexOf('embed') >= 0) c.push('embed');
  /* ?dev=1 -- developer toolbar.  Own URL, or the cockpit page's URL when this
     page is the cockpit's iframe (same convention as app.js / FMM).  Never read
     from storage, so it cannot stay on by accident. */
  var dev = flag(location.search);
  try {
    if (!dev && window.parent && window.parent !== window) dev = flag(window.parent.location.search);
  } catch (e) { /* cross-origin parent: no flag */ }
  if (dev) c.push('dev');
  if (c.length) document.documentElement.className = c.join(' ');
})();
</script>


<h1 class="module-title" id="moduleTitle">Core Memory Banks (KVS)</h1>

    <div id="hots"></div>

      <div id="ledgerCard" role="dialog" aria-label="Bank ledger" tabindex="-1">
        <div class="phd">
          <span class="ttl">Bank ledger</span>
          <span class="sz" id="ledgerSize"></span>
          <button type="button" class="pclose" id="ledgerClose" aria-label="Close" title="Put the ledger back (Esc)">&times;</button>
        </div>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="tabKeys" aria-selected="true" aria-controls="faceKeys">Keys</button>

          <div class="prow"><span class="pk">keys</span><input id="ledgerSKeys" spellcheck="false" autocomplete="off" aria-label="Script keys" title="KEYS[1], KEYS[2], ... separated by spaces"></div>
