<!doctype html>
<!-- SAINTCON 2026 — HARNESS IDENTIFICATION.

     Separate HTML screen, not a plate on the 3D wide shot.  Serve the REPO
     ROOT (./live3d/run.sh) and open:

         http://localhost:8777/live3d/auth/

     The cockpit at /live3d/ does not redirect here.  Guest browse of the
     theatre is the product.  This page talks to same-origin /api/*; the
     browser never talks to the cloud harness and never holds a token.

     `file://` DOES NOT WORK: the ES module load is blocked, and there is no
     /api on a file origin.  The banner below says so. -->
<meta charset="utf-8">
<title>USS AUDITOR-7 — identify</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#02030a;overflow:hidden;color:#9fb6d0;
    font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  #stars{position:fixed;left:0;right:0;top:0;bottom:0;
    width:100%;height:100%;z-index:0;display:block}
  #doc{position:fixed;left:0;right:0;top:0;bottom:0;z-index:1;
    display:flex;align-items:center;justify-content:center;padding:24px;
    overflow:auto}
  #card{width:min(440px,100%);background:rgba(10,13,20,.92);
    border:1px solid #1d2836;padding:28px 26px 22px}
  #card h1{font-size:11px;font-weight:400;letter-spacing:.2em;
    text-transform:uppercase;margin-bottom:10px}
  #card p{color:#5f7590;margin:0 0 14px}
  #card p .val{color:#9fb6d0}
  .tabs{display:flex;gap:8px;margin:0 0 14px}
  label{display:block;letter-spacing:.12em;text-transform:uppercase;
    color:#5f7590;font-size:10.5px;margin:0 0 10px}
  label span{display:block;margin-bottom:4px}
  input{font:inherit;width:100%;padding:7px 9px;background:#131a26;
    color:#d8e8fa;border:1px solid #24405e;border-radius:3px}
  input:focus{outline:none;border-color:#3d6a96;color:#d8e8fa}
  .row{display:flex;justify-content:flex-end;margin:4px 0 12px}
  #authOut{margin:4px 0 14px;padding:10px 12px;white-space:pre-wrap;
    font-size:12px;background:#0a0d14;border:1px solid #1d2836;color:#9fb6d0}
  #authOut.err{background:#2a0d0d;border-color:#a33;color:#ffb4b4}
  #authOut.ok{border-color:#24405e;color:#9fb6d0}
  button{font:inherit;letter-spacing:.12em;text-transform:uppercase;
    white-space:nowrap;flex:none;
    padding:5px 10px;background:#131a26;color:#9fb6d0;border:1px solid #24405e;
    border-radius:3px;cursor:pointer}
  button:hover{color:#d8e8fa;border-color:#3d6a96}
  button.on{background:#c79a2e;color:#161208;border-color:#f2d67a}
  button.on:hover{color:#161208;border-color:#f2d67a}
  button[disabled]{opacity:.35;cursor:default;border-color:#1d2836}
  #err{position:fixed;inset:auto 12px 16px 12px;z-index:40;display:none;
    background:#2a0d0d;border:1px solid #a33;color:#ffb4b4;padding:10px 12px;
    white-space:pre-wrap;font-size:12px}
</style>

<canvas id="stars"></canvas>
<div id="doc">
  <div id="card">
    <h1>identification</h1>

    <div id="stUnconfigured" hidden>
      <p>set <span class="val">HARNESS_URL</span> on the console to link the harness</p>
    </div>

    <div id="stGuest" hidden>
      <p>linked to <span class="val" id="guestUrl"></span> · sign in or register</p>
      <div class="tabs">
        <button type="button" id="tabLogin" class="on" data-tab="login">login</button>
        <button type="button" id="tabRegister" data-tab="register">register</button>
      </div>
      <form id="loginForm">
        <label><span>username</span>
          <input name="username" autocomplete="username"></label>
        <label><span>password</span>
          <input name="password" type="password" autocomplete="current-password"></label>
        <div class="row">
          <button type="submit" class="on">login</button>
        </div>
      </form>
      <form id="registerForm" hidden>
        <label><span>display name</span>
          <input name="name" autocomplete="name"></label>
        <label><span>username</span>
          <input name="username" autocomplete="username"></label>
        <label><span>password</span>
          <input name="password" type="password" autocomplete="new-password"></label>
        <div class="row">
          <button type="submit" class="on">register</button>
        </div>
      </form>
    </div>

    <div id="stIn" hidden>
      <p>linked to <span class="val" id="inUrl"></span> · signed in as <span class="val" id="inUser"></span></p>
      <p>Your token is held by the local bridge, not the browser.</p>
      <div class="row">
        <button type="button" id="bLogout">sign out</button>
      </div>
    </div>

    <pre id="authOut" hidden aria-live="polite"></pre>
    <div class="row">
      <button type="button" id="bEnter" class="on">enter cockpit</button>
    </div>
  </div>
</div>
<div id="err"></div>
<script src="../stars.js"></script>
<script>
/* file:// — SAY SO, RATHER THAN SHOWING A BLANK PAGE.
   Ordinary inline script, not the module: a module load over file:// is
   refused before one line of it runs.  Auth also needs same-origin /api. */
if (location.protocol === 'file:') {
  var e = document.getElementById('err');
  e.style.display = 'block';
  e.textContent =
    'This page is open over file:// and that cannot work.\n\n' +
    'Chrome refuses the ES module load outright (CORS, origin "null"), and ' +
    'login talks to /api on the cockpit origin, which a file URL does not ' +
    'have.  Nothing the page can do changes that.\n\n' +
    'Run this instead, from the repo root:\n' +
    '    ./live3d/run.sh\n\n' +
    'then open http://localhost:8777/live3d/auth/';
}
</script>
<script type="module" src="./auth.js"></script>
